      - Breadcrumb "Voltar" no header
    verify: |
      grep -q 'selectedGroup\|groupStandings' /Users/danielvm/Developer/big-bolao/web/src/views/GroupDetailView.vue 2>/dev/null && echo "✅ group detail existe"
    bcp: 0.5

  - id: e03-s08
    title: "Navegação interativa entre views + breadcrumb"
    description: >
      Conectar todas as views com navegação clicável:
      - Clicar no líder → PlayerDetailView
      - Clicar em avatar/nome no ranking → PlayerDetailView
      - Clicar em avatar/nome no cabeçalho da grade → PlayerDetailView
      - Clicar em bandeira/nome do time → CountryDetailView
      - Clicar em badge de grupo → GroupDetailView
      - Botão "Voltar" no header retorna à landing do dashboard
