stories:
  - id: e08-s01
    title: "Fix + cover: fuzzy placeholder-name substring defect (bigbase.py)"
    description: >
      File specs/bugs/BUG-2026-07-04-<time>-placeholder-substring-misattribution.md
      documenting the defect: _placeholder_por_nome_parcial (bolao/bigbase.py)
      matches on unbounded substring (pnome in alvo or alvo in pnome) with no
      word boundaries, so a short placeholder name (e.g. "Ana") wrongly matches
      an unrelated new user whose name contains it as a substring (e.g.
      "Mariana"), silently migrating the wrong person's historical palpites
      via _vincular_placeholder. Fix: require a full whitespace-delimited
      token match (placeholder's name-tokens are a subset of the candidate's
      name-tokens, or vice versa) instead of raw substring containment; if a
      name matches zero or more-than-one placeholder, do not auto-link — leave
      it to the /sou manual path (reivindicar). Add regression tests in
      tests/test_participantes.py covering: (a) the "Ana"/"Mariana" false
      positive is no longer created, (b) the legitimate "Flávia" / "Ana Flavia
      Cernic Ramos" case from BUG-2026-06-20-100000 still auto-links, (c)
      ambiguous multi-match refuses to auto-link. This closes the majority of
      bigbase.py's coverage gap (registrar_participante, reivindicar,
      _placeholder_por_nome_parcial, _vincular_placeholder) as a side effect of
      testing real behavior, not as a coverage-for-its-own-sake exercise.
    verify: |
      python -m pytest tests/test_participantes.py -q && \
      python -m pytest --cov=bolao/bigbase --cov-report=term-missing -q | grep bigbase
    bcp: 1
    wsjf: 8.0
    wsjf_rationale: "BV=8 fixes a real silent-misattribution bug + TC=3 flexible + RR=8 closes identity-integrity risk / JS=2 1 day"
    depends: []

  - id: e08-s02
    title: "Declare historico.py and handlers.py as risk-register exclusions"
    description: >
      Update specs/test-strategy/risk-register.yaml: mark bolao/historico.py as
      an intentional 0%-coverage entry (static Rodada-1 transcription, already
      exercised offline by scripts/check_ranking.py which is not part of the
      pytest suite by design — no live BigBase/network calls). Mark
      bolao/handlers.py's low coverage as an explicit, epic-linked deferral
      (depends_on: e07) rather than a gap — the module is scheduled for
      extraction, not in-place testing. Add both to
      specs/test-strategy/traceability.md so a future coverage report reads
      these as decisions, not oversights. Optionally add historico.py to a
      coverage-omit config so TOTAL% reflects only modules under active
      coverage policy.
    verify: |
      grep -q 'historico' specs/test-strategy/risk-register.yaml && \
      grep -q 'e07' specs/test-strategy/risk-register.yaml
    bcp: 0.5
    wsjf: 4.0
    wsjf_rationale: "BV=3 documentation clarity + TC=1 no urgency + RR=3 prevents future false-alarm on the same 65% number / JS=1 hours"
    depends: []

  - id: e08-s03
    title: "Live-ranking verification script (regression guard, not one-off)"
    description: >
      Codify the ad-hoc live-data verification performed during this epic's
      scoping (2026-07-04: 93 jogos / 593 palpites / 10 participantes / 86
      finished matches, cross-checked via ranking.py, a raw independent loop,
      and web/src/scoring.js — all three agreed byte-for-byte) as a repeatable
      script: scripts/verify_live_ranking.py. It should fetch live BigBase data
      read-only, recompute ranking two independent ways (ranking.calcular() vs
      a hand-rolled loop using bolao.scoring.pontos() directly), and fail loudly
      if they disagree — a cheap tripwire against a future regression in
      ranking.py without needing the JS runtime. Do NOT persist or print
      participant PII beyond what's already shown in /ranking; do not write
      any temp files with live data (the ad-hoc check in this session used and
      deleted /tmp/live_data.json — the script should never touch disk).
    verify: |
      python -m scripts.verify_live_ranking
    bcp: 0.5
    wsjf: 4.5
    wsjf_rationale: "BV=3 cheap regression guard + TC=1 no urgency + RR=5 catches ranking drift before users notice / JS=1 hours"
    depends: []
