id: e08
slug: coverage-priorities
title: "Risk-Prioritized Coverage — participant identity + declared exclusions"
status: planned
bcp: 2.0
wsjf: 6.7
wsjf_rationale: "BV=5 fixes a real production-risk bug + TC=3 flexible + RR=8 closes the one gap that coincides with correctness risk / JS=2 1 day"

description: >
  Follow-up to the release-branch coverage warning (65% overall on the docs/
  planning-e07-adrs-domain-model branch — pre-existing on main, no code in that
  branch). The 65% figure is correctly read through specs/test-strategy/
  risk-register.yaml, not as a flat target: P0 modules (scoring.py 100%,
  ranking.py 98%, fixtures.py 98%) are already covered by e06's golden fixtures.
  The overall number is dragged down by two modules, and only one of them is a
  coverage problem worth solving directly:

    - bolao/bigbase.py (57%): the uncovered lines are the PARTICIPANT IDENTITY
      paths (registrar_participante, reivindicar, _placeholder_por_nome_parcial,
      _vincular_placeholder — lines 113-259). This is the exact machinery
      modeled in ADR-003 (Edition/Participante/Placeholder/Link/Merge), and it
      contains a REAL, UNFIXED DEFECT found during that modeling session:
      _placeholder_por_nome_parcial does unbounded substring matching with no
      word boundaries, so a placeholder "Ana" wrongly matches a new user
      "Mariana" ("ana" is a substring of "mariana") and silently migrates the
      wrong person's historical bets. Coverage and correctness coincide here —
      this is the priority-1 story.

    - bolao/handlers.py (23%): the uncovered lines are almost entirely the
      publication/job-scheduling orchestration already identified as
      Module-Depth 2/5 in the deepen-architecture session and already scoped
      for extraction in epic e07 (GroupAnnouncer + ResultsPublisher + jobs.py).
      Testing handlers.py in place would mean mocking Telegram+BigBase
      together for code that's about to be deleted/moved — writing tests
      against a module already condemned to refactor. This epic does NOT
      attempt to raise handlers.py coverage directly; e07 is what makes it
      testable. Recorded here as an explicit deferral, not an oversight.

    - bolao/historico.py (0%): static transcription of Rodada-1 spreadsheet
      data (already exercised indirectly by scripts/check_ranking.py, which is
      not part of the pytest suite). A unit test here would assert data equals
      itself. This epic marks it as a deliberate no-coverage entry in the risk
      register rather than writing a hollow test.

  Also verified during this epic's scoping (2026-07-04): the CURRENTLY LIVE
  ranking was independently recomputed three ways against real BigBase data
  (93 jogos, 593 palpites, 10 participantes, 86 finished matches) — via
  bolao/ranking.py::calcular(), via a raw hand-rolled loop bypassing
  ranking.py entirely, and via web/src/scoring.js::calcRanking() on the same
  data. All three produced byte-identical results for all 9 active
  participants (1 excluded record confirmed correct: the "Flávia" Placeholder,
  telegram_id=-4, already Linked to the real account per the ADR-003 state
  machine). No ranking bug exists today — this epic is preventive, not
  reactive.

priorities:
  p1_correctness_and_coverage: [e08-s01]
  p2_declared_exclusion: [e08-s02]
  p3_deferred_to_e07: [e08-s03]

