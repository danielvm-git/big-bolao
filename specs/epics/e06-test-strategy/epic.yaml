id: e06
slug: test-strategy
title: "Test Strategy & Architecture Overhaul (TEA-style)"
status: in-progress
bcp: 7.5
bcps_delivered: 3.5
wsjf: 6.8
wsjf_rationale: "BV=8 prevents recurring production bugs + TC=5 active recurrence risk + RR=8 targets proven failure class / JS=3 ~1 week across 6 stories"

description: >
  Implements specs/REFACTOR_LATEST.md. Two failure classes have each caused
  more than one production bug: Python↔JS scoring drift (BUG-2026-06-30-150000,
  BUG-2026-07-04-170000) and penalty/ET score parsing (BUG-2026-06-30-140000,
  recurred as BUG-2026-07-03-191600). This epic makes both classes structurally
  impossible to reintroduce silently via a shared golden fixture (single source
  of truth consumed by both test suites), a risk-based test strategy doc set,
  and file-based CI governance gates that fail the build when a bug ships
  without a registered regression test.

  Source plan: specs/REFACTOR_LATEST.md (21 commits across 6 phases A–F).

stories:
  - id: e06-s01
    title: "Test-strategy foundation — risk register + traceability matrix"
    description: >
      Create specs/test-strategy/ with README (how to run every suite),
      risk-register.yaml (probability × impact score per module, P0/P1/P2),
      and traceability.md (requirement/bug → guarding test, GAP where none
      exists). Docs only, no behavior change. Corresponds to REFACTOR_LATEST.md
      Phase A (commits 1-3).
    verify: |
      test -f specs/test-strategy/README.md && \
      python3 -c "import yaml;yaml.safe_load(open('specs/test-strategy/risk-register.yaml'))" && \
      test -f specs/test-strategy/traceability.md
    bcp: 1
    wsjf: 4.5
    wsjf_rationale: "BV=3 groundwork only + TC=3 flexible + RR=3 low direct risk reduction / JS=2 1 day"
    depends: []
    tasks:
      - id: e06-s01-t01
        title: "Create specs/test-strategy/ directory and README.md"
        description: >
          Create specs/test-strategy/ directory. Write README.md documenting
          every test suite in the project: how to run it, what it covers, and
          any special setup required. Include sections for Python tests (pytest),
          web tests (node --test), and CI suite.
        acceptance:
          - "specs/test-strategy/README.md exists and documents all test suites"
          - "README references the golden fixture files and governance scripts"

      - id: e06-s01-t02
        title: "Create risk-register.yaml"
        description: >
          Write specs/test-strategy/risk-register.yaml as a structured YAML file
          listing each module (bolao/scoring, bolao/fixtures, bolao/ranking,
          bolao/bigbase, web/src/scoring.js, etc.) with probability × impact
          scores, P0/P1/P2 priority, and notes on known failure modes. Draw
          from BUG-*.md files and the REFACTOR_LATEST.md plan.
        acceptance:
          - "risk-register.yaml is valid YAML"
          - "Covers scoring, fixtures, ranking, bigbase, and web scoring modules"
          - "Assigns P0/P1/P2 priorities based on bug history"

      - id: e06-s01-t03
        title: "Create traceability.md"
        description: >
          Write specs/test-strategy/traceability.md mapping each known bug
          (specs/bugs/BUG-*.md) and each requirement to its guarding test.
          Mark GAP where no test exists. Reference the epic.yaml stories for
          planned coverage.
        acceptance:
          - "traceability.md lists all bug files and their test coverage"
          - "GAP entries are marked for stories e06-s02 through e06-05"
          - "Traceability includes Python and web test suites"

  - id: e06-s02
    title: "Shared scoring golden fixture — Python↔JS parity, enforced"
    description: >
      Add specs/test-strategy/scoring-golden.json (group + R32/R16/QF/SF/3P/FIN,
      exact/winner/miss cases). Add tests/test_scoring.py (loads fixture, asserts
      bolao/scoring.py::pontos()). Add web/tests/scoring-golden.test.js (loads
      THE SAME file, asserts web/src/scoring.js::calcPontos()). Remove now-stale
      group-only assertions from web/tests/scoring.test.js. This is the core
      invariant of the whole epic: any Python↔JS drift now fails both suites.
      Corresponds to REFACTOR_LATEST.md Phase B (commits 4-7).
    verify: |
      python3 -c "import json;d=json.load(open('specs/test-strategy/scoring-golden.json'));assert len(d)>=21" && \
      python -m pytest tests/test_scoring.py -q && \
      cd web && node --test tests/scoring-golden.test.js
    bcp: 1.5
    wsjf: 9.3
    wsjf_rationale: "BV=10 closes the top recurring failure class + TC=8 active risk + RR=10 eliminates drift structurally / JS=3 2-3 days"
    depends: [e06-s01]
    tasks:
      - id: e06-s02-t01
        title: "Create specs/test-strategy/scoring-golden.json"
        description: >
          Write a golden fixture JSON file with ≥21 test cases covering all phases
          (group/R1/R2/R3, R32, R16, QF, SF, 3P, FIN) and bet types (exact, winner,
          miss). Each case has: palpite_casa, palpite_fora, real_casa, real_fora,
          match_id, expected_pontos. Include edge cases like draws, 0-0, large scores.
        acceptance:
          - "JSON file has ≥21 entries"
          - "Covers all 4 bet outcomes: exact, winner-home, winner-away, draw-winner"
          - "Covers all phases: group, R32, R16, QF, SF, 3P, FIN"

      - id: e06-s02-t02
        title: "Create tests/test_scoring.py"
        description: >
          Write a Python test file that loads scoring-golden.json from the project root
          (via pathlib relative to test file), iterates each case, calls
          bolao/scoring.py::pontos() with the case params, and asserts result matches
          expected_pontos. No mocking needed — pure function.
        acceptance:
          - "test_scoring.py exists and is importable"
          - "Golden fixture loads from specs/test-strategy/ relative to project root"
          - "All 21+ golden cases pass"

      - id: e06-s02-t03
        title: "Create web/tests/scoring-golden.test.js"
        description: >
          Write a JS test file that loads the SAME scoring-golden.json (using relative
          path ../../specs/test-strategy/scoring-golden.json from web/tests/), iterates
          each case, calls calcPontos() from ../src/scoring.js, and asserts result
          matches expected_pontos. This locks Python↔JS parity.
        acceptance:
          - "scoring-golden.test.js loads the same golden fixture"
          - "All 21+ golden cases pass in Node test runner"

      - id: e06-s02-t04
        title: "Remove stale group-only assertions from web/tests/scoring.test.js"
        description: >
          Remove the group-only calcPontos assertions (lines 12-34, testing 3/1/0
          default scoring) since they are now covered by the golden fixture test.
          Keep all phase-aware knockout tests, calcRanking tests, and formatter tests.
        acceptance:
          - "Group-only scoring assertions removed"
          - "All phase-aware and ranking tests remain"
          - "Full web test suite still passes (including golden fixture test)"

  - id: e06-s03
    title: "Fix BUG-2026-07-04-170000 TDD-style using the golden suite"
    status: done
    date: "2026-07-04"
    description: >
      Write a failing golden-derived case asserting a knockout exact bet labels
      as 'exato' (confirm RED). Extract scoreLabelFor(pa,pb,ra,rb,matchId) as a
      pure function in web/src/scoring.js (calls calcPontos WITH matchId).
      Update web/src/store.js::scoreLabel() to delegate, passing jogo.match_id.
      Rebuild web/dist. Close out the bug file with tests_added. Demonstrates
      the new strategy fixing a live, still-open defect.
      Corresponds to REFACTOR_LATEST.md Phase C (commits 8-11).
    verify: |
      cd web && node --test tests/*.test.js && npx vite build && \
      grep -q 'Status.*fixed' ../specs/bugs/BUG-2026-07-04-170000-knockout-exact-bets-mislabeled.md
    bcp: 1
    wsjf: 9.0
    wsjf_rationale: "BV=8 fixes real open bug + TC=5 currently misleading users + RR=5 proves the pattern works / JS=2 1 day"
    depends: [e06-s02]
    tasks:
      - id: e06-s03-t01
        title: "Add expected_label to golden fixture + JS test"
        description: >
          Add expected_label field to each case in scoring-golden.json ('exato',
          'vencedor', 'errou'). Add test in scoring-golden.test.js that calls
          scoreLabelFor() and asserts match. Knockout exact cases should fail
          before the fix (RED) — they currently label as 'errou'.
        acceptance:
          - "Golden fixture has expected_label on all 24 cases"
          - "Knockout exact cases fail before fix (RED)"
          - "Group exact cases pass before fix"

      - id: e06-s03-t02
        title: "Extract scoreLabelFor() as pure function in web/src/scoring.js"
        description: >
          Add scoreLabelFor(pa, pb, ra, rb, matchId) that calls calcPontos(pa,pb,ra,rb,matchId)
          and returns 'exato' / 'vencedor' / 'errou' based on the result using
          phase-aware scoring thresholds.
        acceptance:
          - "scoreLabelFor is a named export from scoring.js"
          - "Returns correct labels for all golden fixture cases"
          - "Pure function — no side effects, no I/O"

      - id: e06-s03-t03
        title: "Update store.js::scoreLabel() to delegate with matchId"
        description: >
          Update scoreLabel in store.js to call scoreLabelFor() passing
          jogo.match_id as the fifth argument, instead of calling calcPontos
          directly without matchId.
        acceptance:
          - "store.js imports and uses scoreLabelFor"
          - "jogo.match_id is passed as the 5th argument"
          - "All web tests pass"

      - id: e06-s03-t04
        title: "Rebuild web/dist and close bug file"
        description: >
          Run npx vite build in web/ to update dist/. Update the bug file
          BUG-2026-07-04-170000-knockout-exact-bets-mislabeled.md: set Status
          to 'fixed', add tests_added section referencing scoring-golden.json.
        acceptance:
          - "web/dist/ is rebuilt"
          - "Bug file Status is 'fixed'"
          - "Bug file has tests_added section"

  - id: e06-s04
    title: "Golden fixture for parse_result + poller regression coverage"
    status: planned
    description: >
      Add specs/test-strategy/parse-result-golden.json (every ET status, every
      penalty variant, regular finish, unknown-future status → expected score).
      Re-source tests/test_fixtures.py::TestParseResultFieldSelection from the
      golden file (same behavior, traceable to one place). Confirm/add coverage
      in tests/test_bot.py for the 409-Conflict ERROR-level log and
      drop_pending_updates=True — the zombie-poller failure class.
      Corresponds to REFACTOR_LATEST.md Phase D (commits 12-14).
    verify: |
      python3 -c "import json;json.load(open('specs/test-strategy/parse-result-golden.json'))" && \
      python -m pytest tests/test_fixtures.py tests/test_bot.py -q
    bcp: 1
    wsjf: 4.3
    wsjf_rationale: "BV=5 hardens a twice-fixed bug class + TC=3 flexible + RR=5 moderate mitigation / JS=3 2-3 days"
    depends: [e06-s01]
    tasks:
      - id: e06-s04-t01
        title: "Create specs/test-strategy/parse-result-golden.json"
        description: >
          Write a golden fixture JSON file with ≥15 test cases covering all
          parse_result() code paths: ET statuses (After ET, AET, Finished AET
          → uses match_score), penalty variants (After Pen., PEN, Finished PEN
          → uses ft_score), regular finish (Finished, FT → uses ft_score),
          non-finished (Half Time, Not Started → ft_score safe fallback),
          unknown future status → ft_score (defense against drift), FT missing
          → fallback to match_score, non-numeric match_score → ft_score works,
          both scores absent → null. Each case has: desc, match_status,
          match_hometeam_score, match_awayteam_score, match_hometeam_ft_score,
          match_awayteam_ft_score, expected_home, expected_away.
        acceptance:
          - "JSON file has ≥15 entries"
          - "Covers ET, penalty, regular, non-finished, unknown, missing-FT edge cases"
          - "All entries have expected_home and expected_away (or null)"
          - "Loads as valid JSON"

      - id: e06-s04-t02
        title: "Re-source TestParseResultFieldSelection from golden file"
        description: >
          Remove the inline parametrized test groups in
          tests/test_fixtures.py::TestParseResultFieldSelection. Replace with a
          single parametrize that loads parse-result-golden.json relative to
          the project root (same pattern as test_scoring.py::load_golden()),
          iterates each case, calls parse_result() with the case fields, and
          asserts result matches expected_home/expected_away. Keep the
          parametrize structure to preserve test granularity (one assertion
          per case).
        acceptance:
          - "TestParseResultFieldSelection no longer has inline fixture dicts"
          - "Loads golden JSON from specs/test-strategy/parse-result-golden.json"
          - "All golden cases pass through parametrized test"
          - "Same number of test assertions as pre-refactor"

      - id: e06-s04-t03
        title: "Confirm bot poller coverage, document in test strategy"
        description: >
          Review tests/test_bot.py to confirm all zombie-poller failure-class
          scenarios are covered: drop_pending_updates=True, allowed_updates
          filter, 409 Conflict ERROR-level logging, error handler registration.
          Add any missing test cases if gaps found. Update traceability.md
          to reference the bot test file for the poller failure class.
        acceptance:
          - "Bot poller coverage confirmed — no gaps found"
          - "traceability.md updated with bot poller test references"
          - "test_bot.py passes all tests"

  - id: e06-s05
    title: "File-based CI governance gates (bug registry, scoring parity, coverage)"
    description: >
      Add scripts/check_test_governance.py (fails if any specs/bugs/BUG-*.md
      lacks a registry.yaml entry or tests_added — would have caught the 3
      currently-unregistered bugs). Backfill the 3 missing registry entries.
      Add scripts/check_scoring_tables.py (structural belt-and-suspenders:
      parses FASE_PONTOS from both languages, asserts equality). Add P0-scoped
      coverage gate (bolao/scoring, bolao/fixtures, bolao/ranking @ 90%+, not
      whole-repo). Wire all of it plus `cd web && npm test` into
      .github/workflows/ci-cd.yml before the deploy step. Add
      specs/test-strategy/quality-gate.md (Definition-of-Done + gate rubric).
      File-based per bigpowers conventions — no gh issue create, no direct
      GitHub REST calls. Corresponds to REFACTOR_LATEST.md Phase E (commits 15-20).
    verify: |
      python3 scripts/check_test_governance.py && \
      python3 scripts/check_scoring_tables.py && \
      python -m pytest --cov=bolao/scoring --cov=bolao/fixtures --cov=bolao/ranking --cov-fail-under=90 -q && \
      python3 -c "import yaml;yaml.safe_load(open('.github/workflows/ci-cd.yml'))"
    bcp: 1.5
    wsjf: 7.0
    wsjf_rationale: "BV=8 makes governance enforced not aspirational + TC=5 stops future silent gaps + RR=8 catches the exact registry-drift already found / JS=3 2-3 days"
    depends: [e06-s02, e06-s04]

  - id: e06-s06
    title: "Documentation reconciliation — CLAUDE.md test section"
    description: >
      Update CLAUDE.md's test-file inventory (11 Python files + web suites,
      currently stale at 9), reference specs/test-strategy/, and document the
      golden-fixture invariant plus the new governance gates so future sessions
      discover this strategy without re-deriving it.
      Corresponds to REFACTOR_LATEST.md Phase F (commit 21).
    verify: |
      grep -q 'test-strategy' CLAUDE.md
    bcp: 0.5
    wsjf: 5.0
    wsjf_rationale: "BV=3 discoverability only + TC=1 no urgency + RR=1 no direct risk reduction / JS=1 hours"
    depends: [e06-s05]
