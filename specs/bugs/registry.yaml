bugs:
- bug_id: BUG-2026-06-19-183500
  date: '2026-06-19'
  severity: medium
  priority: high
  scope: app-shell
  summary: Bottom navigation buttons unresponsive — router-view conditionally mounted
    via v-if/v-else breaks router outlet
  file: specs/bugs/BUG-2026-06-19-183500-nav-buttons.md
  status: fixed
  fixed_date: '2026-06-19'
  root_cause: <router-view v-slot> with <transition> fails to resolve lazy-loaded
    route components in Vue Router 4; v-if/v-else conditional mounting broke outlet
    registration
  approach: Replaced v-slot+transition router-view with plain <router-view />; LoginView
    overlays via position:absolute
  risk_level: low
  files_changed:
  - web/src/App.vue
  tests_added:
  - web/tests/router.test.js (4 unit tests)
  - web/test-e2e.cjs (15 e2e tests)
  hardening:
  - Code comment in App.vue warning against v-slot on router-view
  - Route config unit test prevents route definition errors
  commit_message: 'fix(web): bottom nav buttons unresponsive — removed v-slot on router-view'
- bug_id: BUG-2026-06-19-180800
  date: '2026-06-19'
  severity: high
  priority: critical
  scope: bot-sync
  summary: /sync returns 0 results — wrong APIFOOTBALL_LEAGUE_ID=1, SQL 403, Markdown
    parse errors
  file: specs/bugs/BUG-2026-06-19-180800-sync-misconfiguration.md
  status: fixed
  fixed_date: '2026-06-19'
  root_cause: 'Three causes: APIFOOTBALL_LEAGUE_ID=1 in .env (was 28); BigBase /api/sql
    returns 403 for service account; Telegram Markdown v1 crashes on underscores in
    bot username'
  approach: Fixed league ID in .env; removed all sql() from bigbase.py (list_records+filter);
    switched all messages to HTML parse mode
  risk_level: low
  files_changed:
  - .env
  - bolao/config.py
  - bolao/bigbase.py
  - bolao/handlers.py
  - bolao/ranking.py
  - bolao/results.py
  tests_added:
  - tests/test_config.py (5 tests)
  - tests/test_fixtures.py (14 tests)
  - tests/test_results.py (7 tests)
  hardening:
  - validate_config() in config.py raises RuntimeError on missing/wrong API config
    at startup
  - load_dotenv(override=True) prevents shell env vars from silently overriding .env
  - 26-test suite covering all fixed code paths
  commit_message: 'fix(bot): wrong league_id, SQL 403, Markdown parse errors — add
    startup guard + test suite'
- bug_id: BUG-2026-06-19-215300
  date: '2026-06-19'
  severity: medium
  priority: high
  scope: web-dashboard
  summary: Dashboard shows 0/0 jogos finalizados — useJogos/useRanking gate on isLoggedIn,
    never fetch for public view
  file: specs/bugs/BUG-2026-06-19-215300-dashboard-zero-jogos.md
  status: fixed
  fixed_date: '2026-06-20'
  root_cause: useJogos and useRanking only fetch when isLoggedIn fires; DashboardView
    is public but data never loads without auth
  approach: DashboardView fetches jogos + ranking directly on onMounted, bypassing
    auth gate; / → Dashboard (public), /home → HomeView (auth)
  risk_level: low
  files_changed:
  - web/src/router/index.js
  - web/src/App.vue
  - web/src/views/DashboardView.vue
  - web/src/views/LoginView.vue
  - web/src/components/BottomNav.vue
  commit_message: 'feat(web): make dashboard the public landing page at /'
- bug_id: BUG-2026-06-19-190000
  date: '2026-06-19'
  severity: medium
  priority: high
  scope: deploy
  summary: Deploy falha — BigBase root_path não propagado ao DetectAppType; pip binário
    não portátil
  file: specs/bugs/BUG-2026-06-19-190000-deploy-fail.md
  status: open
  root_cause: BigBase deploy/DetectAppType ignora o campo root_path da tabela sites
    — sempre escaneia a raiz do clone. O repo tem requirements.txt na raiz (bot) e
    package.json em web/ (site).
  approach: 'Workaround: package.json na raiz delegando build para web/. Fix definitivo:
    PR no BigBase propagando root_path para DetectAppType + python3 -m pip'
  risk_level: medium
- bug_id: BUG-2026-06-20-100000
  date: '2026-06-20'
  severity: low
  priority: medium
  scope: bot-registration
  summary: Participantes duplicados via /start quando nome do Telegram difere do nome
    histórico
  file: specs/bugs/BUG-2026-06-20-100000-duplicate-participants.md
  status: open
  root_cause: registrar_participante só verifica nome exato antes de criar — não varre
    placeholders com telegram_id negativo cujo nome esteja contido no novo nome
  approach: Adicionar varredura de placeholders (telegram_id < 0) antes de criar,
    vinculando por substring do nome
  risk_level: low
- bug_id: BUG-2026-06-20-143237
  date: '2026-06-20'
  severity: low
  priority: medium
  scope: web-dashboard
  summary: Bandeiras de alguns países não aparecem (Iraq, Uzbekistan, Jordan, D.R.
    Congo) — fallback de bandeira branca renderiza como documento em branco
  file: specs/bugs/BUG-2026-06-20-143237-missing-country-flags.md
  status: fixed
  fixed_date: '2026-06-20'
  root_cause: 'Duas causas: (1) dicionário de bandeiras do frontend é cópia incompleta
    do mapa do bot — faltam chaves (iraq, uzbekistan, jordan, etc.); (2) normalização
    do lookup não remove pontuação, então "D.R. Congo" não casa com a chave "dr congo"'
  approach: Completar dicionário com todos os países do torneio + normalização resiliente
    a pontuação/espaços; teste-guardião cobrindo todo o calendário
  risk_level: low
- bug_id: BUG-2026-06-20-173500
  date: '2026-06-20'
  severity: medium
  priority: high
  scope: web-preview
  summary: Telegram link preview quebrado — og:image SVG nao suportado, convertido
    para PNG
  file: specs/bugs/BUG-2026-06-20-173500-instant-view-ogimage-svg.md
  status: fixed
  fixed_date: '2026-06-20'
  root_cause: og:image apontava para SVG (image/svg+xml). Telegram so suporta JPEG/PNG/WEBP
    para link previews.
  approach: Converter og-image.svg para PNG 1200x630 via rsvg-convert. Atualizar referencias
    em web/index.html e web/dist/index.html.
  risk_level: low
