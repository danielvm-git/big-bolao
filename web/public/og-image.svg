<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111315"/>
      <stop offset="100%" stop-color="#1a1d23"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Diagonal accent stripe -->
  <polygon points="0,630 630,0 690,0 60,630" fill="#e4002b" opacity=".12"/>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,.04)" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="590"/>
    <line x1="200" y1="40" x2="200" y2="590"/>
    <line x1="300" y1="40" x2="300" y2="590"/>
    <line x1="400" y1="40" x2="400" y2="590"/>
    <line x1="500" y1="40" x2="500" y2="590"/>
    <line x1="600" y1="40" x2="600" y2="590"/>
    <line x1="700" y1="40" x2="700" y2="590"/>
    <line x1="800" y1="40" x2="800" y2="590"/>
    <line x1="900" y1="40" x2="900" y2="590"/>
    <line x1="1000" y1="40" x2="1000" y2="590"/>
    <line x1="1100" y1="40" x2="1100" y2="590"/>
  </g>

  <!-- Kicker label -->
  <text x="72" y="120" font-family="'Space Mono','SF Mono',monospace" font-size="14"
        letter-spacing="4" fill="#5b6066" text-transform="uppercase">
    BIG BOLÃO — TEMPORADA 2026
  </text>

  <!-- Rule line -->
  <line x1="72" y1="148" x2="365" y2="148" stroke="#e4002b" stroke-width="3"/>

  <!-- Main title: "Big" -->
  <text x="72" y="290" font-family="Inter,'Helvetica Neue',sans-serif"
        font-size="132" font-weight="900" letter-spacing="-4" fill="#ffffff">
    Big
  </text>

  <!-- Main title: "Bolão" in red -->
  <text x="72" y="440" font-family="Inter,'Helvetica Neue',sans-serif"
        font-size="160" font-weight="900" letter-spacing="-5" fill="#e4002b">
    Bolão.
  </text>

  <!-- Right side: "Copa do Mundo" -->
  <text x="720" y="200" font-family="'Space Mono','SF Mono',monospace"
        font-size="13" letter-spacing="3" fill="#5b6066" text-transform="uppercase">
    COPA DO MUNDO
  </text>

  <!-- Right side: "2026" -->
  <text x="720" y="290" font-family="Inter,'Helvetica Neue',sans-serif"
        font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">
    2026
  </text>

  <!-- Right side: description -->
  <text x="720" y="350" font-family="Inter,'Helvetica Neue',sans-serif"
        font-size="18" fill="#5b6066">
    <tspan x="720" dy="0">O bolão dos Jararacas.</tspan>
    <tspan x="720" dy="28">72 jogos. 1 campeão.</tspan>
  </text>

  <!-- CTA link visual -->
  <rect x="720" y="420" width="200" height="44" rx="2" fill="#e4002b"/>
  <text x="820" y="448" font-family="'Space Mono','SF Mono',monospace"
        font-size="12" letter-spacing="1" fill="#ffffff"
        text-anchor="middle" text-transform="uppercase">
    ENTRAR NO BOLÃO
  </text>

  <!-- Bottom url -->
  <text x="72" y="560" font-family="'Space Mono','SF Mono',monospace"
        font-size="11" letter-spacing="3" fill="#3a3e45" text-transform="uppercase">
    BOLAO.BIGBASE.CLICK
  </text>

  <!-- Football mini icon (◉) -->
  <circle cx="1128" cy="72" r="18" fill="none" stroke="#e4002b" stroke-width="2" opacity=".3"/>
  <circle cx="1128" cy="72" r="6" fill="#e4002b" opacity=".3"/>
</svg>
