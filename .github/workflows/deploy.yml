# ============================================================================
# deploy.yml — Kamal deploy to the Oracle A1 (production)
#
# Runs only after "Test, Build & Release" succeeds on main. It never builds:
# it deploys the exact image CI built, after verifying its provenance.
#
#   deploy-meta → gh attestation verify → Tailscale (OIDC, tag:ci) → kamal deploy
#
# Environment "production" secrets:
#   KAMAL_SSH_KEY       private key of the `deploy` user on Oracle (tailnet only)
#   BOLAO_LINK_SECRET   HMAC key that signs each user's site link
# Environment "production" variables (not secret):
#   TS_OAUTH_CLIENT_ID, TS_AUDIENCE   Tailscale federated identity
# ============================================================================
name: Deploy

on:
  workflow_run:
    workflows: ["Test, Build & Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://bolao.danielvm.net
  # Pinned Oracle host key: the deploy fails if anything else answers on oracle-prod.
  ORACLE_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKg7IJKpbW/pEapRqjxXYdZpEA6t5xdSzCaOu6Y33KUJ

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
      id-token: write
    steps:
      - name: Download deploy-meta
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-meta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: deploy-meta

      - name: Read deploy-meta
        id: meta
        run: |
          set -euo pipefail
          sha=$(jq -r .sha deploy-meta/deploy-meta.json)
          digest=$(jq -r .digest deploy-meta/deploy-meta.json)
          [[ "$sha" == "${{ github.event.workflow_run.head_sha }}" ]] || { echo "::error::sha mismatch"; exit 1; }
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify provenance and that the tag is the attested digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${{ steps.meta.outputs.digest }}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/test-build-release.yml"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tagged=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$tagged" == "${{ steps.meta.outputs.digest }}" ]] || { echo "::error::tag does not point at the attested digest"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.sha }}
          persist-credentials: false

      - name: Join the tailnet (ephemeral, tag:ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: oracle-prod

      - name: Pin the Oracle host key
        run: |
          install -d -m 700 ~/.ssh
          echo "oracle-prod ${ORACLE_HOST_KEY}" > ~/.ssh/known_hosts
          printf 'Host oracle-prod\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' > ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config

      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: "3.4"

      - name: Kamal deploy (no build, the attested image)
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BOLAO_LINK_SECRET: ${{ secrets.BOLAO_LINK_SECRET }}
        run: |
          gem install kamal -v 2.12.0 --no-document
          kamal deploy --skip-push --version "${{ steps.meta.outputs.sha }}"

      - name: Smoke test through the tunnel
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}/up" || true)
            [[ "$code" == "200" ]] && { echo "up"; exit 0; }
            sleep 10
          done
          echo "::error::${SITE_URL}/up returned ${code}"; exit 1
