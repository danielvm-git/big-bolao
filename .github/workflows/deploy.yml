# ============================================================================
# deploy.yml — Deploy to BigBase (triggered after test-build-release passes)
#
# Triggered via workflow_run on test-build-release.yml.
# Only deploys when the triggering workflow succeeded on main.
#
# Includes post-deploy smoke test (health check).
#
# Secrets needed:
#   - BIGBASE_DEPLOY_TOKEN: scoped deploy token
#   - BIGBASE_SITE_ID: site this token is scoped to
# ============================================================================
name: Deploy (BigBase)

on:
  workflow_run:
    workflows: ["Test, Build & Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  APP_TYPE: python
  SITE_URL: "https://bolao.bigbase.click"

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to BigBase
        uses: danielvm-git/.github/actions/bigbase-deploy@main
        with:
          site_id: ${{ secrets.BIGBASE_SITE_ID }}
          app_type: ${{ env.APP_TYPE }}
          site_url: ${{ env.SITE_URL }}
          deploy_token: ${{ secrets.BIGBASE_DEPLOY_TOKEN }}

  smoke-test:
    needs: [deploy]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Post-deploy health check
        run: |
          ATTEMPTS=8
          INTERVAL=10
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${{ env.SITE_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              BODY=$(curl -s "${{ env.SITE_URL }}/health")
              echo "Health check passed: $BODY"
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: HTTP $STATUS, waiting ${INTERVAL}s..."
            sleep "$INTERVAL"
          done
          echo "::error::Health check failed after $ATTEMPTS attempts"
          exit 1
