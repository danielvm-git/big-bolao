# ============================================================================
# ci-cd.yml — CI/CD pipeline for Big Bolão
#
# Triggers:
#   - Push to main → semantic-release analyzes commits, runs tests, deploys
#   - Manual workflow_dispatch (for re-deploying without a new release)
#
# Pipeline:
#   1. Semantic Release (commit-analyzer → version bump → GitHub Release)
#   2. Web build (npm ci + vite build in web/)
#   3. Python tests + governance gates (pytest, governance scripts, coverage)
#   4. Web tests (node --test)
#   5. BigBase login (email/password → JWT)
#   6. Deploy trigger (POST /api/sites/{id}/deploy → BigBase auto-deploys)
#   7. Health check (curl site, 5 retries, 10s interval)
#   8. Failure notification
#
# Secrets needed (repo Settings → Secrets and variables → Actions):
#   - BIGBASE_EMAIL: service account email
#   - BIGBASE_PASSWORD: service account password
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  BIGBASE_URL: "https://bigbase.click"
  BIGBASE_REPO_ID: "04c58b9df51405ee33378c2539f9ea68"
  SITE_URL: "https://bolao.bigbase.click"

jobs:
  ci-cd:
    name: CI/CD
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # Step 0: Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # -----------------------------------------------------------------------
      # Step 1: Semantic Release
      # -----------------------------------------------------------------------
      - name: Setup Node
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Save pre-release HEAD
        id: pre-release
        if: github.event_name == 'push'
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install semantic-release
        if: github.event_name == 'push'
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git

      - name: Semantic Release
        if: github.event_name == 'push'
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Detect if release was created ---
      - name: Detect new release
        id: detect-release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual deploy"
          else
            NEW_HEAD=$(git rev-parse HEAD)
            if [ "${{ steps.pre-release.outputs.head }}" != "$NEW_HEAD" ]; then
              echo "new_release=true" >> "$GITHUB_OUTPUT"
              echo "New release detected"
            else
              echo "new_release=false" >> "$GITHUB_OUTPUT"
              echo "No new release - skipping deploy"
            fi
          fi

      # -----------------------------------------------------------------------
      # Step 2: Web build
      # -----------------------------------------------------------------------
      - name: Setup Node for web build
        if: steps.detect-release.outputs.new_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Build web (Vite)
        if: steps.detect-release.outputs.new_release == 'true'
        working-directory: web
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --prefer-offline
          npm run build
          echo "Web dist: $(ls dist/ 2>/dev/null | wc -l) files"

      - name: Auto-commit rebuilt web/dist
        if: steps.detect-release.outputs.new_release == 'true'
        run: |
          if [ -n "$(git status --porcelain web/dist/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add web/dist/
            git commit -m "build(web): auto-commit rebuilt dist [skip ci]"
            git push
            echo "Committed rebuilt web/dist/"
          else
            echo "web/dist/ already up to date"
          fi

      # -----------------------------------------------------------------------
      # Step 3: Python tests + governance gates
      # -----------------------------------------------------------------------
      - name: Setup Python
        if: steps.detect-release.outputs.new_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Run Python tests
        if: steps.detect-release.outputs.new_release == 'true'
        env:
          TELEGRAM_TOKEN: ci-test-token
          BIGBASE_EMAIL: ci-test@test.local
          BIGBASE_PASSWORD: ci-test-password
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
          python -m pytest tests/ -v

      # --- Governance gate 1: Bug registry check ---
      - name: Check bug registry
        if: steps.detect-release.outputs.new_release == 'true'
        run: python3 scripts/check_test_governance.py

      # --- Governance gate 2: Scoring table parity ---
      - name: Check scoring table parity
        if: steps.detect-release.outputs.new_release == 'true'
        run: python3 scripts/check_scoring_tables.py

      # --- Governance gate 3: P0 module coverage ---
      - name: Check P0 coverage
        if: steps.detect-release.outputs.new_release == 'true'
        env:
          TELEGRAM_TOKEN: ci-test-token
          BIGBASE_EMAIL: ci-test@test.local
          BIGBASE_PASSWORD: ci-test-password
        run: |
          python -m pytest --cov=bolao.scoring --cov-fail-under=90 tests/test_scoring.py -q
          python -m pytest --cov=bolao.fixtures --cov-fail-under=90 tests/test_fixtures.py -q
          python -m pytest --cov=bolao.ranking --cov-fail-under=90 tests/test_ranking.py -q

      # -----------------------------------------------------------------------
      # Step 4: Web tests
      # -----------------------------------------------------------------------
      - name: Setup Node for web tests
        if: steps.detect-release.outputs.new_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Run web tests
        if: steps.detect-release.outputs.new_release == 'true'
        working-directory: web
        run: |
          npm ci --prefer-offline
          node --test tests/*.test.js

      # -----------------------------------------------------------------------
      # Step 5: Deploy to BigBase
      # -----------------------------------------------------------------------
      - name: Login to BigBase
        id: login
        if: steps.detect-release.outputs.new_release == 'true'
        run: |
          RESPONSE=$(curl -sS -X POST \
            "${{ env.BIGBASE_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.BIGBASE_EMAIL }}\",\"password\":\"${{ secrets.BIGBASE_PASSWORD }}\"}")
          TOKEN=$(echo "${RESPONSE}" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])" 2>/dev/null || echo "")
          if [ -z "${TOKEN}" ]; then
            echo "ERROR: Login failed"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Trigger BigBase deploy
        id: deploy
        if: steps.detect-release.outputs.new_release == 'true'
        run: |
          RESPONSE=$(curl -sS -X POST \
            "${{ env.BIGBASE_URL }}/api/sites/${{ env.BIGBASE_REPO_ID }}/deploy" \
            -H "Authorization: Bearer ${{ steps.login.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"branch": "main", "app_type": "python", "passthrough_paths": ["/api/version"]}')
          echo "Deploy triggered: ${RESPONSE}"
          DEPLOY_ID=$(echo "${RESPONSE}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          echo "deployment_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployment ID: ${DEPLOY_ID}"

      # -----------------------------------------------------------------------
      # Step 7: Health check (site responds, BigBase auto-finishes deploy)
      # -----------------------------------------------------------------------
      - name: Health check
        if: steps.detect-release.outputs.new_release == 'true'
        run: |
          echo "Waiting for deploy to propagate..."
          HEALTH_PASS=false
          for i in 1 2 3 4 5 6 7 8; do
            sleep 10
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${{ env.SITE_URL }}" 2>/dev/null || echo "000")
            echo "  [${i}/8] HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              HEALTH_PASS=true
              echo "  Healthy - Big Bolao is live"
              break
            fi
          done
          if [ "${HEALTH_PASS}" = false ]; then
            echo "Health check failed after 8 attempts"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 8: Summary
      # -----------------------------------------------------------------------
      - name: Summary
        if: success() && steps.detect-release.outputs.new_release == 'true'
        run: |
          echo ""
          echo "========================================="
          echo "  CI/CD Complete"
          echo "  Site:    ${{ env.SITE_URL }}"
          echo "  Time:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "  Run:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "========================================="

  # ==========================================================================
  # Notify on failure
  # ==========================================================================
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ci-cd]
    if: failure() && github.event_name != 'workflow_dispatch'
    steps:
      - name: Build failure summary
        run: |
          echo "Big Bolao CI/CD FAILED"
          echo "  Repository: ${{ github.repository }}"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Run:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
