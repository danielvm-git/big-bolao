# ============================================================================
# ci-cd.yml — CI/CD pipeline for Big Bolão
#
# Based on ci-cd-monorepo.yml template (v2.0.0) with project-specific additions:
#   - Semantic Release (version bump + changelog + GitHub Release)
#   - Governance gates (G1 bug registry, G2 scoring parity, G3 P0 coverage)
#   - Web build + auto-commit of web/dist/ (BigBase deploys from repo)
#   - Failure notification
#
# Pipeline:
#   ci (node + python) → verify → semantic-release → deploy
#
# Secrets needed (repo Settings → Secrets and variables → Actions):
#   - BIGBASE_DEPLOY_TOKEN: scoped deploy token
#   - BIGBASE_SITE_ID: site this token is scoped to
#
# NOTE: web/dist/ auto-commit is kept because BigBase deploys from the repo
# (not from artifacts) and app.py serves web/dist/ at runtime.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  APP_TYPE: python
  SITE_URL: "https://bolao.bigbase.click"

jobs:
  # ==========================================================================
  # CI: Node.js (web SPA)
  # ==========================================================================
  node:
    if: hashFiles('web/package.json') != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint --if-present

      - name: Test
        working-directory: web
        run: node --test tests/*.test.js

      - name: Build
        working-directory: web
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm run build

  # ==========================================================================
  # CI: Python (bot + backend)
  # ==========================================================================
  python:
    if: hashFiles('requirements.txt') != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Test
        env:
          TELEGRAM_TOKEN: ci-test-token
          BIGBASE_EMAIL: ci-test@test.local
          BIGBASE_PASSWORD: ci-test-password
        run: python -m pytest tests/ -v

      # --- Governance gate 1: Bug registry check ---
      - name: Check bug registry (G1)
        run: python3 scripts/check_test_governance.py

      # --- Governance gate 2: Scoring table parity ---
      - name: Check scoring table parity (G2)
        run: python3 scripts/check_scoring_tables.py

      # --- Governance gate 3: P0 module coverage ---
      - name: Check P0 coverage (G3)
        env:
          TELEGRAM_TOKEN: ci-test-token
          BIGBASE_EMAIL: ci-test@test.local
          BIGBASE_PASSWORD: ci-test-password
        run: |
          python -m pytest --cov=bolao.scoring --cov-fail-under=90 tests/test_scoring.py -q
          python -m pytest --cov=bolao.fixtures --cov-fail-under=90 tests/test_fixtures.py -q
          python -m pytest --cov=bolao.ranking --cov-fail-under=90 tests/test_ranking.py -q

  # ==========================================================================
  # Verify: preflight + conventional commits + no AI attribution
  # ==========================================================================
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        working-directory: web
        run: npm ci

      - name: Preflight
        run: bash scripts/preflight.sh

      - name: Check Conventional Commits
        run: |
          git log origin/main..HEAD --oneline | while read -r line; do
            if ! echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: "; then
              echo "FAIL: Non-conventional commit: $line"
              exit 1
            fi
          done
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        run: |
          if git log origin/main..HEAD --format="%B" | grep -qiE '^co[- ]authored[- ]by:'; then
            echo "FAIL: Co-authored-by: footer found"
            exit 1
          fi
          echo "PASS: No AI agent attribution"

  # ==========================================================================
  # Semantic Release (push to main only)
  # ==========================================================================
  semantic-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, python, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Save pre-release HEAD
        id: pre-release
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect new release
        id: detect-release
        run: |
          NEW_HEAD=$(git rev-parse HEAD)
          if [ "${{ steps.pre-release.outputs.head }}" != "$NEW_HEAD" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "New release detected"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

  # ==========================================================================
  # Web build + auto-commit (after semantic-release, if new release)
  # ==========================================================================
  web-build-commit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.semantic-release.outputs.new_release == 'true'
    needs: [semantic-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Commit rebuilt web/dist
        run: |
          if [ -n "$(git status --porcelain web/dist/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add web/dist/
            git commit -m "build(web): auto-commit rebuilt dist [skip ci]"
            git push
            echo "Committed rebuilt web/dist/"
          else
            echo "web/dist/ already up to date"
          fi

  # ==========================================================================
  # Deploy to BigBase
  # ==========================================================================
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, python, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to BigBase
        uses: danielvm-git/.github/actions/bigbase-deploy@main
        with:
          site_id: ${{ secrets.BIGBASE_SITE_ID }}
          app_type: ${{ env.APP_TYPE }}
          site_url: ${{ env.SITE_URL }}
          deploy_token: ${{ secrets.BIGBASE_DEPLOY_TOKEN }}

  # ==========================================================================
  # Notify on failure
  # ==========================================================================
  notify:
    name: Notify on failure
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [node, python, verify, semantic-release, web-build-commit, deploy]
    if: always() && failure() && github.event_name != 'workflow_dispatch'
    steps:
      - name: Build failure summary
        run: |
          echo "Big Bolao CI/CD FAILED"
          echo "  Repository: ${{ github.repository }}"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Run:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
